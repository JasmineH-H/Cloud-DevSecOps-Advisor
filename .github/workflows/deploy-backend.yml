name: Deploy Backend to ECS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Resolve deployment targets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          BACKEND_ECR_URL: ${{ vars.BACKEND_ECR_URL }}
          ECS_CLUSTER_ID: ${{ vars.ECS_CLUSTER_ID }}
          BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
        run: |
          REGION="${AWS_REGION:-us-east-1}"
          NAME="${PROJECT_NAME:-devsecops-advisor}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          RESOLVED_ECR="${BACKEND_ECR_URL:-${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${NAME}-backend}"
          RESOLVED_CLUSTER="${ECS_CLUSTER_ID:-${NAME}-cluster}"
          RESOLVED_SERVICE="${BACKEND_SERVICE_NAME:-${NAME}-backend-service}"

          echo "AWS_REGION=${REGION}" >> "$GITHUB_ENV"
          echo "BACKEND_ECR_URL=${RESOLVED_ECR}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER_ID=${RESOLVED_CLUSTER}" >> "$GITHUB_ENV"
          echo "BACKEND_SERVICE_NAME=${RESOLVED_SERVICE}" >> "$GITHUB_ENV"

      - name: Login to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${BACKEND_ECR_URL%/*}"

      - name: Build and push backend image
        run: docker buildx build --platform linux/amd64 -t "${BACKEND_ECR_URL}:latest" --push ./backend

      - name: Force ECS backend redeploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_ID}" \
            --service "${BACKEND_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}" >/dev/null
